[project]
name = "simple-data-analyzer"
version = "0.1.0"
description = "A small, reusable CSV data analyzer built with pandas and matplotlib."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[project.scripts]
analyzer = "data_analyzer.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "data_analyzer"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=data_analyzer --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
